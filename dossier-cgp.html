<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Dossier CGP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dossier CGP">
<meta name="theme-color" content="#0c0e10">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0a0c0e}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:#dbb46f}
a:hover{color:#eccea0}
button{font:inherit}
textarea{font-family:inherit}
:root,[data-theme="dark"]{--bg:#0c0e10;--bg-hi:#171a1d;--panel:#15181b;--panel2:#1d2125;--line:#2b3136;--ink:#f6f1e7;--ink2:#b9c1c4;--ink3:#828b8e;--dim:#565e61;--acc:#dbb46f;--acc2:#4fcfa8;--gold:#f2cd82;--warn:#e2895f;--on:#191307}
.panel-glass{background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,0) 45%),var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 0 rgba(0,0,0,.4)}
@keyframes kfSweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes kfSpin{to{transform:rotate(360deg)}}
@keyframes kfBreathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes kfFill{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
@keyframes kfGlow{0%,100%{box-shadow:0 0 0 0 rgba(219,180,111,0)}50%{box-shadow:0 0 0 9px rgba(219,180,111,.16)}}
@keyframes kfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfInFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes kfInBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes kfPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes kfFall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(760px) rotate(620deg);opacity:0}}
@keyframes kfShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes kfRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kfPulseRing{0%{box-shadow:0 0 0 0 rgba(219,180,111,.35)}100%{box-shadow:0 0 0 14px rgba(219,180,111,0)}}
#app{min-height:100dvh;max-width:480px;margin:0 auto;width:100%;background:radial-gradient(85% 60% at 18% -6%,rgba(219,180,111,.10) 0%,rgba(219,180,111,0) 55%),radial-gradient(70% 55% at 100% 0%,rgba(79,207,168,.08) 0%,rgba(79,207,168,0) 60%),radial-gradient(120% 90% at 50% -8%,var(--bg-hi) 0%,var(--bg) 60%);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:640px){
  html,body{background:#050607}
  body{padding:36px 20px;min-height:100vh}
  #app{min-height:0;height:calc(100dvh - 72px);border-radius:28px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);}
}
@media (min-width:1024px){
  body{padding:0;display:flex;align-items:center;justify-content:center}
  #app{
    max-width:1120px;height:min(880px,92vh);
    flex-direction:row;
  }
  #confetti-slot{z-index:40}
  #tabs-slot{
    order:-1;flex-shrink:0;width:232px;height:100%;
    background:var(--panel);border-right:1px solid var(--line);
    box-sizing:border-box;
  }
  #tabs-slot>div{
    display:flex !important;flex-direction:column !important;
    justify-content:flex-start !important;align-items:stretch !important;
    padding:34px 16px !important;background:none !important;
    height:100%;box-sizing:border-box;
  }
  #tabs-slot>div>div{
    display:flex !important;flex-direction:column !important;
    background:none !important;border:none !important;border-radius:0 !important;
    padding:0 !important;gap:4px !important;width:100%;
  }
  #tabs-slot button{
    width:100% !important;text-align:left !important;
    border-radius:12px !important;padding:13px 16px !important;
  }
  #screen{max-width:760px;width:100%;margin:0 auto;}
}
#confetti-slot{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.scr.kfin{animation:kfIn .38s cubic-bezier(.16,1,.3,1) both}
.scr.kfin-fwd{animation:kfInFwd .32s cubic-bezier(.16,1,.3,1) both}
.scr.kfin-back{animation:kfInBack .32s cubic-bezier(.16,1,.3,1) both}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .18s ease,background-color .18s ease,box-shadow .18s ease}
button:active{transform:scale(.96)}
.hv-a{transition:transform .16s ease,border-color .18s ease,box-shadow .18s ease}
.hv-a:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.34),0 0 0 1px rgba(219,180,111,.1)}
.hv-a:active{transform:translateY(0) scale(.97)}
.hv-b:hover{border-color:var(--acc);background:var(--panel2)}
.hv-c:hover{background:var(--panel2)}
.btn-back{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px 10px 13px;font:600 13.5px 'Inter',sans-serif;color:var(--acc);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.btn-back:hover{border-color:var(--acc);background:var(--panel2)}
.btn-back:active{transform:scale(.94)}
.btn-back .bkarr{font:400 17px Fraunces,serif;line-height:1}
.stagger{animation:kfRise .4s cubic-bezier(.16,1,.3,1) both}
.shake{animation:kfShake .4s ease}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line);outline:none;margin:8px 0 0;display:block}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s ease}
input[type="range"]::-webkit-slider-thumb:active{transform:scale(1.15)}
input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;border-width:2px}
input[type="range"]::-moz-range-track{background:var(--line);height:4px;border-radius:2px}
input[type="number"]{width:100%;box-sizing:border-box;font:500 16px 'Inter',sans-serif;font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);outline:none;transition:border-color .18s ease}
input[type="number"]:focus{border-color:var(--acc)}
input[type="number"]:disabled{opacity:.6}
.lab-seg{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:10px;font:500 11.5px 'Inter',sans-serif;color:var(--ink2);cursor:pointer}
.lab-seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@keyframes v16draw{to{stroke-dashoffset:0}}
@keyframes v16bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.v16svg{width:100%;max-width:320px;height:auto;display:block;margin:4px auto}
.v16draw{stroke-dasharray:360;stroke-dashoffset:360;animation:v16draw 1.6s ease forwards .2s}
.v16bar-anim{transform-box:fill-box;transform-origin:bottom;animation:v16bar .7s ease both}
.fold-body{overflow:hidden;transition:grid-template-rows .3s cubic-bezier(.16,1,.3,1);display:grid;grid-template-rows:1fr}
.fold-body>div{overflow:hidden;min-height:0}
.fold-body.fold-closed{grid-template-rows:0fr}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}}
</style>
</head>
<body>
<div id="app" data-theme="dark"></div>
<script src="./cgp-data.js"></script>
<script src="./dossier-cgp.js"></script>
</body>
</html>
